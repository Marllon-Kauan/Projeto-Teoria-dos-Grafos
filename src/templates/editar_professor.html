{% extends "base.html" %}
{% block titulo %}Editar professor{% endblock %}
{% block toolbar %}<nav class="toolbar"><a class="btn" href="{{ url_for('listar_professores') }}">Voltar para professores</a><a class="btn" href="{{ url_for('listar_disciplinas') }}">Disciplinas</a></nav>{% endblock %}
{% block conteudo %}<div class="pagina"><section class="painel"><div class="painel-head"><h2>Editar professor</h2><span class="sub">Atualize os dados de contato.</span></div>
<form class="painel-body formulario" method="post">
  <div class="campo"><label for="nome">Nome <span class="obrigatorio">*</span></label><input id="nome" name="nome" required value="{{ valores.get('nome', '') }}"></div>
  <div class="campo"><label for="email">E-mail <span class="obrigatorio">*</span></label><input id="email" name="email" type="email" required value="{{ valores.get('email', '') }}"></div>
  <button class="btn primary" type="submit">Salvar alterações</button><a class="btn" href="{{ url_for('listar_professores') }}">Cancelar</a>
</form></section></div>{% endblock %}
